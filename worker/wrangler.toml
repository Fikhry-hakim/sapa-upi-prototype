name = "sapa-upi-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# Model bisa diganti tanpa ubah kode. Lihat https://ai.google.dev/gemini-api/docs/models
# gemini-3.5-flash-lite = paling hemat kuota, gemini-3.8-flash = jawaban lebih bagus.
GEMINI_MODEL = "gemini-3.5-flash-lite"

# Origin yang boleh memanggil API ini (dipisah koma).
ALLOWED_ORIGINS = "https://fikhry-hakim.github.io,http://localhost:4173"

# GEMINI_API_KEY TIDAK ditulis di sini — simpan sebagai secret:
#   npx wrangler secret put GEMINI_API_KEY

# Knowledge base. The Worker falls back to the copy bundled at deploy time if
# this is unreachable or empty, so a database outage does not silence answers.
[[d1_databases]]
binding = "sapa_upi_kb"
database_name = "sapa-upi-kb"
database_id = "18387e08-06a8-4015-9c3c-9b1c54baaf8c"
