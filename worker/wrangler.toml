name = "sapa-upi-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# Model bisa diganti tanpa ubah kode. Lihat https://ai.google.dev/gemini-api/docs/models
# gemini-3.5-flash-lite = paling hemat kuota, gemini-3.8-flash = jawaban lebih bagus.
GEMINI_MODEL = "gemini-3.5-flash-lite"

# Origin yang boleh memanggil API ini (dipisah koma).
ALLOWED_ORIGINS = "https://fikhry-hakim.github.io,http://localhost:4173"

# Masuk dengan akun Google. Client ID bukan rahasia; client secret adalah.
# Kosongkan GOOGLE_CLIENT_ID untuk mematikan login sepenuhnya.
GOOGLE_CLIENT_ID = "812633226531-ho0jtb76imslpmtv6s92je3qb0ab1fkt.apps.googleusercontent.com"
OAUTH_REDIRECT_URI = "https://sapa-upi-api.sapa-upi.workers.dev/auth/callback"
APP_URL = "https://fikhry-hakim.github.io/sapa-upi-prototype/"

# Domain email yang boleh masuk, dipisah koma. Subdomain ikut diizinkan,
# jadi "upi.edu" mencakup "student.upi.edu". Kosong berarti tanpa pembatasan.
ALLOWED_EMAIL_DOMAINS = "upi.edu"

# TIDAK ditulis di sini — simpan sebagai secret:
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put GOOGLE_CLIENT_SECRET

# Knowledge base. The Worker falls back to the copy bundled at deploy time if
# this is unreachable or empty, so a database outage does not silence answers.
[[d1_databases]]
binding = "sapa_upi_kb"
database_name = "sapa-upi-kb"
database_id = "18387e08-06a8-4015-9c3c-9b1c54baaf8c"

# Berkas PDF yang diunggah pengelola. R2 butuh diaktifkan lewat dashboard,
# sedangkan KV tersedia di akun gratis dan cukup untuk dokumen sampai 24 MB.
[[kv_namespaces]]
binding = "sapa_upi_files"
id = "f36a335dd00842fbb809ff3875f1e459"
